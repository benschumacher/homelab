services:
  s3ql-media-unsonic:
    image: benschumacher/s3ql:latest
    build:
      context: s3ql-docker
      dockerfile: Dockerfile
      args:
        S3QL_UID: 1000
        S3QL_GID: 1000
#      dockerfile_inline: |
#        FROM benschumacher/s3ql:latest
#        USER root
#        RUN    set -x \
#            && apk add -U --no-cache shadow \
#            && groupmod -g 1000 s3ql \
#            && usermod -u 1000 -g s3ql s3ql \
#            && mkdir -p /mnt/media/unsonic \
#            && chown s3ql:s3ql /mnt/media/unsonic /var/mountpoint \
#            && apk del --no-cache shadow \
#            && apk clean cache \
#            && true
#        USER s3ql
#    user: 1000:1000
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    volumes:
      - /home/debian/.s3ql/authinfo2:/etc/s3ql.authinfo2:ro
      - /etc/fuse.conf:/etc/fuse.conf:ro
      - /data/docker/s3ql:/.s3ql
      - type: bind
        source: /mnt/s3ql/husband-farmers-01/media
        target: /mnt/media
        bind:
          propagation: shared
    command: 
      - gs://husband-farmers-01/unsonic
      - /mnt/media
    environment:
      - S3QL_OPTS=--allow-other
    restart: unless-stopped

