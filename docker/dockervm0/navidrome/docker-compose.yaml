  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000
    ports:
      - "4533:4533/tcp"
    environment:
      - ND_LASTFM_APIKEY=e054bd62a6733f98d6efa5041f7f6426
      - ND_LASTFM_SECRET=b5530990d2a78af1b4a9247000949976
    depends_on:
      - s3ql-media-unsonic
    volumes:
      - "/data/docker/navidrome:/data"
      - "/mnt/nfs/lagos/media/Music:/music:ro"
#      - "/media:/music:ro"
    networks:
      - navidrome
    dns:
      - 192.168.11.12
      - 1.1.1.1

